[cmd.crocodile]
desc = "Начать игру в Крокодил"

started = "🎭 Игра в Крокодил началась!\n\nВедущий: {{.Host}}\n\nНажмите кнопку ниже, чтобы получить слово"
started_skipped_words = "🎭 Игра в Крокодил началась!\n\nВедущий: {{.Host}}\n\nПропущенные слова: {{.SkippedWords}}"
stopped = "🛑 Игра в Крокодил завершена"
continued = "Продолжил игру {{.User}}"
