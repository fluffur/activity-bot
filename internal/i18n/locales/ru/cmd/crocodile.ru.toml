winner = "🎉 {{.User}} угадал слово <b>{{.Word}}</b>!\n\nКто хочет продолжить?"

already_started = "⚠️ В этом чате уже идёт игра"

[cmd.crocodile.error]
already_started = "⚠️ В этом чате уже идёт игра"
not_started = "⚠️ Сейчас нет активной игры"
not_host = "❌ Это действие доступно только ведущему"
next_word = "❌ Не удалось получить новое слово"
finish = "❌ Не удалось завершить игру"
start = "❌ Не удалось начать игру"

[cmd.crocodile.button]
show_word = "🎭 Показать слово"
next = "🔄 Другое слово"
finish = "🏁 Завершить"
become_host = "🎤 Стать ведущим"

[cmd.crocodile.callback]
word = "🎭 Твоё слово: {{.Word}}"
next = "🔄 Новое слово выбрано"
finished = "🏁 Игра завершена"
host = "🎤 Вы стали ведущим"

[cmd.stop_crocodile]
