[cmd.add_norm]
desc = "Добавить новую норму"
example_simple = "+норма 50"
example_named = "+норма 70 варн"
example_users = """+норма 10 особенные
@user1 @user2"""
err_invalid_value = "Неверное значение нормы {{.Value}}.\nДопустимый диапазон: от {{.Min}} до {{.Max}}."
added = "Норма {{.Name}} {{.Value}} успешно установлена"
norm_general = "общая"

[cmd.list_norms]
desc = "Список всех норм"
title = "Нормы:"
empty = "Нормы отсутствуют"
item = "• {{.Name}} — {{.Value}}"

[cmd.show_norm]
desc = "Просмотр нормы"
example = "норма варн"
body = "Норма \"{{.Name}}\": {{.Value}}"
not_found = "Норма с названием {{.Name}} ещё не установлена\n\nПопробуйте ввести: <code>+норма {{.Name}} 100</code>"
members = "👥 Участники:"
all_members = "👥 Применяется ко всем участникам чата"

[cmd.assign_norm]
desc = "Назначить норму участникам"
example = "назначить норму админы @user1 @user2"
assigned = "Норма {{.Name}} успешно назначена указанным участникам"
no_users = "Не удалось назначить норму на указанных участников"

[cmd.unassign_norm]
desc = "Снять норму участникам"
example = "снять норму админы @user"
unassigned = "Норма {{.Name}} успешно снята у указанных участников"
no_users = "Не удалось снять норму у указанных участников"

[cmd.delete_norm]
desc = "Удалить норму"
example = "-норма варн"
deleted = "Норма \"{{.Name}}\" удалена"
err_nothing_to_delete = "Норма с именем \"{{.Name}}\" не найдена для удаления"
