[system]
add_bot_button = { other = "Добавить бота в группу" }
bot_commands = { other = "Команды бота" }
bot_added = { other = "Меня добавили в группу!\n\nТеперь, для того, чтобы я мог работать корректно, мне нужно выдать права администратора в группе (все пункты, кроме анонимности)" }
bot_added_admin = { other = "Меня добавили в группу!\n\nТеперь можно приступить к настройке бота" }
no_permission = { other = "Для выполнения этой команды требуются права \"{{.Status}}\"" }

[user]
unknown = { other = "участник" }
left_male = { other = "{{.User}} вышел из чата" }
left_female = { other = "{{.User}} вышла из чата" }
joined_male = { other = "{{.User}} присоединился к чату" }
joined_female = { other = "{{.User}} присоединилась к чату" }
returned_male = { other = "{{.User}} вернулся в чат" }
returned_female = { other = "{{.User}} вернулась в чат" }

[status]
member = { other = "участник" }
moderator = { other = "модератор" }
junior_admin = { other = "младший администратор" }
senior_admin = { other = "старший администратор" }
coowner = { other = "совладелец" }
owner = { other = "владелец" }

[category]
help = { other = "Помощь" }
summon = { other = "Созывы" }
stats = { other = "Статистика" }

[arg_type]
user = { other = "@user" }
number = { other = "число" }
duration = { other = "период" }
datetime = { other = "дата" }
text = { other = "текст" }

# Раздел для строк конкретных команд
[cmd]
[cmd.help]
desc = { other = "Помощь по командам бота" }
body = { other = "📚 {{.CommandsLink}}\n\nЕсли нужна помощь, обратитесь к {{.DeveloperLink}}" }
syntax = { other = "Синтаксис:" }
examples = { other = "Примеры:" }
aliases_label = { other = "Синонимы: {{.Aliases}}" }

[cmd.summon]
desc = { other = "Созыв всех участников" }

[cmd.add_norm]
desc = { other = "Добавить новую норму" }
example_simple = { other = "+норма 50" }
example_named = { other = "+норма 70 варн" }
example_users = { other = """+норма 10 особенные
@user1 @user2""" }